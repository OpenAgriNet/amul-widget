[project]
name = "amul-widget-bff"
version = "0.1.0"
description = "Security and integration boundary for the embeddable Amul AI widget"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.128.0",
  "httpx==0.28.1",
  "pydantic-settings==2.12.0",
  "PyJWT[crypto]==2.10.1",
  "uvicorn[standard]==0.40.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "ruff>=0.16.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/widget_bff"]
