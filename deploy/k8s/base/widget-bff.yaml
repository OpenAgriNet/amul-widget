apiVersion: apps/v1
kind: Deployment
metadata:
  name: widget-bff
  namespace: amul-prod
  labels:
    app.kubernetes.io/name: widget-bff
    app.kubernetes.io/part-of: amul-widget
spec:
  replicas: 2
  selector:
    matchLabels:
      app: widget-bff
  template:
    metadata:
      labels:
        app: widget-bff
        app.kubernetes.io/name: widget-bff
        app.kubernetes.io/part-of: amul-widget
    spec:
      imagePullSecrets:
        - name: regcred
      nodeSelector:
        role: backend
      containers:
        - name: widget-bff
          image: registry.prod.amulai.in/widget-bff:1bd2899
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: WIDGET_ENVIRONMENT
              value: production
            - name: WIDGET_AMUL_API_BASE_URL
              value: http://amul-oan-api.amul-prod.svc.cluster.local:8000
            - name: WIDGET_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: widget-bff-secrets
                  key: jwt-secret
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: widget-bff
  namespace: amul-prod
  labels:
    app.kubernetes.io/name: widget-bff
    app.kubernetes.io/part-of: amul-widget
spec:
  selector:
    app: widget-bff
  ports:
    - port: 8000
      targetPort: 8000
