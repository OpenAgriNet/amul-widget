apiVersion: apps/v1
kind: Deployment
metadata:
  name: widget-bff
  namespace: amul-prod
  labels:
    app.kubernetes.io/name: widget-bff
    app.kubernetes.io/part-of: amul-widget
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: widget-bff
  template:
    metadata:
      labels:
        app: widget-bff
        app.kubernetes.io/name: widget-bff
        app.kubernetes.io/part-of: amul-widget
    spec:
      terminationGracePeriodSeconds: 135
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: regcred
      nodeSelector:
        role: backend
      containers:
        - name: widget-bff
          image: registry.prod.amulai.in/widget-bff:5c537d7
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8000
          env:
            - name: WIDGET_ENVIRONMENT
              value: production
            - name: WIDGET_AMUL_API_BASE_URL
              value: http://amul-oan-api.amul-prod.svc.cluster.local:8000
            - name: WIDGET_REDIS_URL
              value: redis://10.5.25.141:6379/2
            - name: WIDGET_REDIS_KEY_PREFIX
              value: amul-widget-prod
            - name: WIDGET_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: widget-bff-secrets
                  key: jwt-secret
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: widget-bff
  namespace: amul-prod
  labels:
    app.kubernetes.io/name: widget-bff
    app.kubernetes.io/part-of: amul-widget
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: widget-bff
---
apiVersion: v1
kind: Service
metadata:
  name: widget-bff
  namespace: amul-prod
  labels:
    app.kubernetes.io/name: widget-bff
    app.kubernetes.io/part-of: amul-widget
spec:
  selector:
    app: widget-bff
  ports:
    - port: 8000
      targetPort: 8000
