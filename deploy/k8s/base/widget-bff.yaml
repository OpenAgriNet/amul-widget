apiVersion: apps/v1
kind: Deployment
metadata:
  name: widget-bff
spec:
  replicas: 2
  selector:
    matchLabels:
      app: widget-bff
  template:
    metadata:
      labels:
        app: widget-bff
    spec:
      containers:
        - name: widget-bff
          image: registry.prod.amulai.in/widget-bff:latest
          ports:
            - containerPort: 8000
          env:
            - name: WIDGET_ENVIRONMENT
              value: production
            - name: WIDGET_AMUL_API_BASE_URL
              value: https://api.prod.amulai.in
            - name: WIDGET_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: widget-bff-secrets
                  key: jwt-secret
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: widget-bff
spec:
  selector:
    app: widget-bff
  ports:
    - port: 8000
      targetPort: 8000
